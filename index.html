<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#10201b" />
    <meta name="description" content="DewDefenders — a garden survivor. Collect glowing dew, evolve heroes with 100+ evolution states, build your garden, and survive." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DewDefenders" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>DewDefenders — Garden Survivor</title>
    <script>
      /* Register the offline service worker only on secure production origins.
         Registering on localhost dev poisons the Vite dev loop with a
         cache-first worker that hides source changes. */
      if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.Capacitor) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
